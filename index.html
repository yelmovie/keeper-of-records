<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="description" content="기록의 주인 — 사라진 기록을 복원하라. 한국사 기록 복원형 탐구 게임" />
    <meta property="og:title" content="기록의 주인" />
    <meta property="og:description" content="사라진 기록을 복원하라 — 한국사 기록 복원형 탐구 게임" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://keeper-of-records.vercel.app/" />
    <meta property="og:image" content="https://keeper-of-records.vercel.app/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="600" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>기록의 주인 — 사라진 기록을 복원하라</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a1020" />
    <link rel="preload" as="image" href="/assets/bg/title.webp" type="image/webp" />
  </head>
  <body>
    <div id="rotate-guard">
      <div class="rotate-guard__inner">
        <div class="rotate-guard__icon" aria-hidden="true"></div>
        <p>태블릿을 <strong>가로</strong>로 돌려 주세요.</p>
        <p class="rotate-guard__sub">《기록의 주인》은 가로 화면에서 진행됩니다.</p>
      </div>
    </div>
    <div id="app">
      <!-- 부팅 중 흰 화면 방지 — main.ts 부팅 완료 시 제거 -->
      <div id="boot-loading" role="status" aria-live="polite">
        <div class="boot-loading__spinner" aria-hidden="true"></div>
        <p>기록실 여는 중…</p>
      </div>
      <style>
        #boot-loading {
          position: absolute;
          inset: 0;
          z-index: 50;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          background: #0a1020;
          color: #e8e0cf;
          font-family: 'Jua', 'Pretendard', sans-serif;
          font-size: 18px;
        }
        .boot-loading__spinner {
          width: 44px;
          height: 44px;
          border-radius: 50%;
          border: 4px solid rgba(232, 224, 207, 0.25);
          border-top-color: #e8b64c;
          animation: boot-spin 0.9s linear infinite;
        }
        @keyframes boot-spin {
          to { transform: rotate(360deg); }
        }
        @media (prefers-reduced-motion: reduce) {
          .boot-loading__spinner { animation-duration: 2s; }
        }
      </style>
      <div id="stage">
        <div id="phaser-root"></div>
        <div id="ui-overlay"></div>
        <div id="modal-layer"></div>
        <div id="transition-veil"></div>
      </div>
    </div>
    <div id="certificate-print-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
